name: Release verification
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned build dependencies
        run: ./scripts/bootstrap.ps1
      - name: Build and test
        run: ./scripts/build.ps1
      - name: Audit runtime dependencies
        run: ./scripts/audit.ps1
      - name: Browser acceptance against compiled application
        run: node ./scripts/verify-ui.cjs
      - name: Package and verify extracted application
        run: |
          ./scripts/package.ps1
          $archive = Get-ChildItem build/releases/*.zip | Select-Object -First 1
          ./scripts/verify-release.ps1 -Archive $archive.FullName
      - name: Preserve binaries and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-verification
          path: |
            build/releases/*.zip
            build/releases/*.sha256
            artifacts/go-tests.jsonl
            artifacts/release-verification/**/verification.json
            artifacts/dependency-audit/**
            artifacts/ui-acceptance/**/verification.json
            artifacts/ui-acceptance/**/failure.txt
          if-no-files-found: error
          retention-days: 14
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Build, test, audit and package
        run: bash scripts/build-native.sh
      - name: Verify extracted native package
        run: |
          if [ "${{ runner.os }}" = 'macOS' ]; then
            python3 scripts/verify-native.py build/releases/*.zip
          else
            python3 scripts/verify-native.py build/releases/*.tar.gz
          fi
      - name: Preserve native binaries and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform }}-release-verification
          path: |
            build/releases/*.zip
            build/releases/*.tar.gz
            build/releases/*.sha256
            artifacts/go-tests.jsonl
            artifacts/native-verification.json
          if-no-files-found: error
          retention-days: 14
