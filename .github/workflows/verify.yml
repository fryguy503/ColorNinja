name: Windows release verification
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned build dependencies
        run: ./scripts/bootstrap.ps1
      - name: Build and test
        run: ./scripts/build.ps1
      - name: Audit runtime dependencies
        run: ./scripts/audit.ps1
      - name: Browser acceptance against compiled application
        run: node ./scripts/verify-ui.cjs
      - name: Package and verify extracted application
        run: |
          ./scripts/package.ps1
          $archive = Get-ChildItem build/releases/*.zip | Select-Object -First 1
          ./scripts/verify-release.ps1 -Archive $archive.FullName
      - name: Preserve binaries and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-verification
          path: |
            build/releases/*.zip
            build/releases/*.sha256
            artifacts/go-tests.jsonl
            artifacts/release-verification/**/verification.json
            artifacts/dependency-audit/**
            artifacts/ui-acceptance/**/verification.json
            artifacts/ui-acceptance/**/failure.txt
          if-no-files-found: error
          retention-days: 14
